substitutions:
  _REGION: europe-west1
  _REPOSITORY: odis-stream2-repo
  _IMAGE: odis-app

steps:
  # 1. Quality Gates (Install + Mypy + Pytest)
  - name: "python:3.11"
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install -r app/requirements.txt -r requirements-dev.txt
        export MYPYPATH=.
        python3 -m mypy --explicit-package-bases app
        python3 -m pytest --tb=line tests

  # 4. Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg", "BUILDKIT_INLINE_CACHE=1",
        "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}",
        "-f", "app/Dockerfile",
        ".",
      ]

  # 5. Push to Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}",
      ]

  # 6. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_IMAGE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--timeout=3600"
      - "--session-affinity"
      - "--set-env-vars"
      - "STREAMLIT_CLIENT_TOOLBAR_MODE=minimal"
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
# Jacques note: To re-deploy use
# gcloud builds submit --config cloudbuild.yaml .
