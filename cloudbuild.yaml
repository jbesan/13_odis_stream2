substitutions:
  _REGION: europe-west1
  _REPOSITORY: odis-stream2-repo
  _IMAGE: odis-app
  _PROJECT_ID: odis-stream2

steps:
  # 1. Quality Gates (Install + Ruff + Ty + Pytest)
  - name: "python:3.11"
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install -r app/requirements.txt -r requirements-dev.txt
        ruff check app tests
        ruff format --check app tests
        ty check app
        python3 -m pytest --tb=line tests

  # 4. Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg", "BUILDKIT_INLINE_CACHE=1",
        "-t", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}",
        "-f", "app/Dockerfile",
        ".",
      ]

  # 5. Push to Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}",
      ]

  # 6. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_IMAGE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--timeout=3600"
      - "--session-affinity"
      - "--project"
      - "${_PROJECT_ID}"
      - "--set-env-vars"
      - "STREAMLIT_CLIENT_TOOLBAR_MODE=minimal,ODIS_FORCE_AUTH=True,ODIS_AGENT_GCP_PROJECT=odis-stream2,ODIS_AGENT_GCP_LOCATION=eu,ODIS_AI_FREE_MODE=False,GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}"
      - "--set-secrets"
      - "GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,FRANCE_TRAVAIL_CLIENT_ID=FRANCE_TRAVAIL_CLIENT_ID:latest,FRANCE_TRAVAIL_CLIENT_SECRET=FRANCE_TRAVAIL_CLIENT_SECRET:latest,DATA_INCLUSION_API_KEY=DATA_INCLUSION_API_KEY:latest,LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest,ODIS_USERS_CONFIG=ODIS_USERS_CONFIG:latest,/app/.streamlit/secrets.toml=odis-secrets-toml:latest"
images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
# Jacques note: To re-deploy use
# gcloud builds submit --config cloudbuild.yaml .
