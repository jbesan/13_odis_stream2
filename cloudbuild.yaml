substitutions:
  _REGION: europe-west1
  _REPOSITORY: odis-stream2-repo
  _IMAGE: odis-app
  _PROJECT_ID: odis-stream2-app
  _DATA_PROJECT: odis-stream2-app
  _DATA_BUCKET: odis-stream2-app-data-euw1
  _SHARES_BUCKET: odis-stream2-app-shares-euw1
  _SERVICE: odis-app-staging
  _RUNTIME_SA: odis-run@odis-stream2-app.iam.gserviceaccount.com
  _OIDC_REDIRECT_SECRET: OIDC_REDIRECT_URI_STAGING
  _ENV: staging
  _IMAGE_TAG: REQUIRED

serviceAccount: projects/odis-stream2-app/serviceAccounts/odis-ci@odis-stream2-app.iam.gserviceaccount.com

steps:
  - name: "ghcr.io/astral-sh/uv:python3.14-bookworm-slim"
    entrypoint: /bin/bash
    dir: "/workspace"
    args:
      - -ceu
      - |
        if [ "${_IMAGE_TAG}" = "REQUIRED" ]; then
          echo "Pass an immutable _IMAGE_TAG (for example the short Git SHA)." >&2
          exit 64
        fi
        uv sync --frozen --all-groups
        uv run python scripts/sync_datasets.py --bucket=${_DATA_BUCKET}
        uv run ruff check app tests
        uv run ty check app
        uv run pytest --tb=line \
          tests/unit/test_active_manifest.py \
          tests/unit/test_sync_datasets.py \
          tests/unit/test_logfire_env.py \
          tests/unit/test_rna_rag_service.py

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}
      - -f
      - app/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}
      - --revision-suffix=${_ENV}-${_IMAGE_TAG}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --ingress=all
      - --timeout=3600
      - --concurrency=80
      - --cpu=2
      - --memory=4Gi
      - --max-instances=1
      - --session-affinity
      - --cpu-boost
      - --set-env-vars=STREAMLIT_CLIENT_TOOLBAR_MODE=minimal,ODIS_FORCE_AUTH=True,ODIS_AGENT_GCP_PROJECT=${_DATA_PROJECT},ODIS_AGENT_GCP_LOCATION=eu,ODIS_AI_FREE_MODE=False,ODIS_AUTO_ANALYSE_TOP_CITIES=False,ODIS_ENABLE_INTERACTIVE_CHAT=False,GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},ODIS_DEPLOYMENT_ENV=${_ENV},ODIS_DATA_PROJECT=${_DATA_PROJECT},GCS_DATASETS_BUCKET=${_DATA_BUCKET},GCS_SHARED_SEARCHES_BUCKET=${_SHARES_BUCKET}
      - --set-secrets=GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,FRANCE_TRAVAIL_CLIENT_ID=FRANCE_TRAVAIL_CLIENT_ID:latest,FRANCE_TRAVAIL_CLIENT_SECRET=FRANCE_TRAVAIL_CLIENT_SECRET:latest,DATA_INCLUSION_API_KEY=DATA_INCLUSION_API_KEY:latest,OIDC_CLIENT_ID=OIDC_CLIENT_ID:latest,OIDC_CLIENT_SECRET=OIDC_CLIENT_SECRET:latest,OIDC_COOKIE_SECRET=OIDC_COOKIE_SECRET:latest,OIDC_REDIRECT_URI=${_OIDC_REDIRECT_SECRET}:latest,OIDC_AUTHORIZATION_POLICY_JSON=OIDC_AUTHORIZATION_POLICY_JSON:latest,ORGANIZATIONS_CONFIG_JSON=ORGANIZATIONS_CONFIG_JSON:latest

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

