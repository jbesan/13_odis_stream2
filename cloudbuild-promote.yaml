substitutions:
  _REGION: europe-west1
  _REPOSITORY: odis-stream2-repo
  _IMAGE: odis-app
  _PROJECT_ID: odis-stream2-app
  _DATA_PROJECT: odis-stream2-app
  _DATA_BUCKET: odis-stream2-app-data-euw1
  _SHARES_BUCKET: odis-stream2-app-shares-euw1
  _SERVICE: odis-app
  _RUNTIME_SA: odis-run@odis-stream2-app.iam.gserviceaccount.com
  _OIDC_REDIRECT_SECRET: OIDC_REDIRECT_URI_PRODUCTION
  _ENV: production
  _IMAGE_TAG: REQUIRED

serviceAccount: projects/odis-stream2-app/serviceAccounts/odis-ci@odis-stream2-app.iam.gserviceaccount.com

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: /bin/bash
    args:
      - -ceu
      - |
        if [ "${_IMAGE_TAG}" = "REQUIRED" ]; then
          echo "Pass the approved immutable _IMAGE_TAG." >&2
          exit 64
        fi

        image_uri="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
        digest="$$(gcloud artifacts docker images describe "$${image_uri}:${_IMAGE_TAG}" --format='value(image_summary.digest)')"
        test -n "$${digest}"

        gcloud run deploy "${_SERVICE}" \
          --project="${_PROJECT_ID}" --region="${_REGION}" \
          --image="$${image_uri}@$${digest}" \
          --revision-suffix="${_ENV}-${_IMAGE_TAG}" \
          --service-account="${_RUNTIME_SA}" \
          --allow-unauthenticated --ingress=all --timeout=3600 \
          --concurrency=80 --cpu=2 --memory=4Gi --max-instances=1 \
          --session-affinity --cpu-boost \
          --set-env-vars="STREAMLIT_CLIENT_TOOLBAR_MODE=minimal,ODIS_FORCE_AUTH=True,ODIS_AGENT_GCP_PROJECT=${_DATA_PROJECT},ODIS_AGENT_GCP_LOCATION=eu,ODIS_AI_FREE_MODE=False,GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},ODIS_DEPLOYMENT_ENV=${_ENV},ODIS_DATA_PROJECT=${_DATA_PROJECT},GCS_DATASETS_BUCKET=${_DATA_BUCKET},GCS_SHARED_SEARCHES_BUCKET=${_SHARES_BUCKET}" \
          --set-secrets="GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,FRANCE_TRAVAIL_CLIENT_ID=FRANCE_TRAVAIL_CLIENT_ID:latest,FRANCE_TRAVAIL_CLIENT_SECRET=FRANCE_TRAVAIL_CLIENT_SECRET:latest,DATA_INCLUSION_API_KEY=DATA_INCLUSION_API_KEY:latest,LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest,ODIS_USERS_CONFIG=ODIS_USERS_CONFIG:latest,OIDC_CLIENT_ID=OIDC_CLIENT_ID:latest,OIDC_CLIENT_SECRET=OIDC_CLIENT_SECRET:latest,OIDC_COOKIE_SECRET=OIDC_COOKIE_SECRET:latest,OIDC_REDIRECT_URI=${_OIDC_REDIRECT_SECRET}:latest,OIDC_ALLOWED_EMAILS_JSON=OIDC_ALLOWED_EMAILS_JSON:latest,OIDC_EMAIL_ORG_MAPPING_JSON=OIDC_EMAIL_ORG_MAPPING_JSON:latest"

options:
  logging: CLOUD_LOGGING_ONLY

