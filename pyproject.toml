[project]
name = "odis-stream2"
version = "0.1.0"
description = "OD&IS Stream 2 - Application SaaS & Pipeline de Données"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # --- Web Framework & Authentication ---
    "streamlit==1.63.0",
    "authlib==1.8.0",

    # --- Data Science & Geospatial ---
    "numpy==2.5.2",
    "pandas==3.0.5",
    "shapely==2.1.2",
    "pyarrow==25.0.1",

    # --- Visualization & Reporting ---
    "plotly==7.0.0",
    "pydeck==0.9.3",
    "fpdf2==2.8.8",

    # --- AI Agents Swarm & Tools ---
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydantic-ai-slim[google,logfire]==2.37.0",
    "pydantic-graph==2.37.0",
    "google-genai==2.21.0",
    "fastmcp==3.4.7",
    "python-frontmatter==1.3.0",

    # --- Google Cloud Platform ---
    "google-cloud-bigquery==3.44.0",
    "google-cloud-bigquery-storage==2.41.0",
    "google-cloud-storage==3.13.1",
    "db-dtypes==1.7.1",

    # --- Observability, Network & Config ---
    "logfire[httpx]==4.41.0",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ty==0.0.55",
    "ruff==0.15.20",
    "vulture==2.16",
    "pydantic-evals==2.37.0",
    "psutil==7.2.2",
]
pipeline = [
    "pandas==3.0.5",
    "geopandas==1.1.4",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "openpyxl==3.1.5",
    "python-calamine==0.8.2",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
