demographics:
  active_population:
    pcs_filter: "_T"
    employment_status_codes:
      - "1T2"
      - "1"
    code_active: "1T2"
    code_employed: "1"
  population_details:
    sex_filter: "_T"
    target_age_codes:
      - "Y_LT15"
      - "Y25T39"
      - "Y40T54"
    age_group_mapping:
      Y_LT15: "jeune"
      Y25T39: "active"
      Y40T54: "active"
    expected_columns:
      - "pop_jeune_2016"
      - "pop_active_2016"
      - "pop_jeune_2022"
      - "pop_active_2022"

education:
  risky_school_class_threshold: 20.0
  uai_column_candidates:
    - "uai_code"
    - "numero_uai"
    - "identifiant_de_l_etablissement"
  insee_column_candidates:
    - "commune_insee_code"
    - "code_commune"

mobility:
