    - "courriel"

rna_rag:
  embedding_model: "text-multilingual-embedding-002"
  output_dimensionality: 128
  similarity_threshold: 0.70
  hebergement_prompts:
    iml: "Bail solidaire et Intermediation Locative (IML)"
    citoyen: "hébergement citoyen chez l'habitant"

geography:
