# Domain Contracts & Configuration Catalog for ODIS Ingest Pipeline
# This file centralizes business configurations, domain taxonomies, thresholds, and mappings.
# Validated with Pydantic models defined in pipeline/ingest/schemas.py.

bpe:
  target_types:
    - "D502"
    - "D504"
    - "D505"
    - "D509"
    - "D703"
    - "D704"
    - "D705"
    - "D710"
    - "D101"
    - "D107"
    - "D108"
    - "D109"
    - "D111"
    - "D113"
    - "D114"
    - "D115"
    - "A125"
    - "A128"
    - "A129"
    - "D711"
    - "E107"
    - "E108"
    - "E109"

  education:
    categories:
      - name: "is_maternelle"
        codes: ["C107", "C108"]
        output_col: "edu_maternelle_ct"
      - name: "is_elementaire"
        codes: ["C109", "C108"]
        output_col: "edu_elementaire_ct"
      - name: "is_college"
        codes: ["C201"]
        output_col: "edu_college_ct"
      - name: "is_lycee"
        codes: ["C301", "C302", "C303", "C305"]
        output_col: "edu_lycee_ct"
      - name: "is_eaje"
        codes: ["D502"]
        output_col: "edu_eaje_ct"
      - name: "is_relais_petite_enfance"
        codes: ["D504"]
        output_col: "edu_relais_petite_enfance_ct"
      - name: "is_alsh"
        codes: ["D505"]
        output_col: "edu_alsh_ct"
      - name: "is_micro_creche"
        codes: ["D509"]
        output_col: "edu_micro_creche_ct"
    labels:
      C107: "École Maternelle"
      C108: "École Primaire"
      C109: "École Élémentaire"
      C201: "Collège"
      C301: "Lycée Général/Tech"
      C302: "Lycée Professionnel"
      C303: "Lycée Agricole"
      C305: "Section Enseignement Pro"
      D502: "Crèche / EAJE"
      D504: "Relais Petite Enfance"
      D505: "Accueil de loisirs (ALSH)"
      D509: "Micro-crèche"

  hebergement:
    exact_types:
      D703: "CHRS"
      D704: "CPH"
      D705: "CADA"
    d710_patterns:
      - regex: "fjt|foyer jeunes travailleurs"
        sub_type: "FJT"
      - regex: "pension"
        sub_type: "Pension"
    columns:
      CHRS:
        indicator: "is_chrs"
        output_col: "heb_chrs_count"
      CPH:
        indicator: "is_cph"
        output_col: "heb_cph_count"
      CADA:
        indicator: "is_cada"
        output_col: "heb_cada_count"
      FJT:
        indicator: "is_fjt"
        output_col: "heb_fjt_count"
      Pension:
        indicator: "is_pension"
        output_col: "heb_pension_count"

  sante:
    indicators:
      - code: "D101"
        indicator: "is_hopital"
        output_col: "count_hopital"
        label: "Hôpital"
      - code: "D107"
        indicator: "is_maternite"
        output_col: "count_maternite"
        label: "Maternité"
      - code: "D108"
        indicator: "is_centre_sante"
        output_col: "count_centre_sante"
        label: "Centre de santé"
      - code: "D109"
        indicator: "is_psy"
        output_col: "count_psy"
        label: "Soutien Psychologique"
      - code: "D111"
        indicator: "is_dialyse"
        output_col: "count_dialyse"
        label: "Dialyse"
      - code: "D113"
        indicator: "is_maison_sante"
        output_col: "count_maison_sante"
        label: "Maison de santé"
      - code: "D114"
        indicator: "is_addictologie"
        output_col: "count_addictologie"
        label: "Addictologie"
      - code: "D115"
        indicator: "is_pmi"
        output_col: "count_pmi"
        label: "Santé maternelle et infantile (PMI)"

  action_sociale:
    indicators:
      - code: "A125"
        indicator: "is_antenne_justice"
        output_col: "act_antenne_justice_count"
        label: "Antenne de justice"
        category: "action_sociale"
      - code: "A128"
        indicator: "is_france_services"
        output_col: "act_france_services_count"
        label: "France Services"
        category: "action_sociale"
      - code: "A129"
        indicator: "is_mairie"
        output_col: "act_mairie_count"
        label: "Mairie"
        category: "mairie"
      - code: "D711"
        indicator: "is_femmes_vuln"
        output_col: "act_femmes_vuln_count"
        label: "Aide femmes vulnérables"
        category: "action_sociale"

  gares:
    types:
      - "E107"
      - "E108"
      - "E109"
    poi_label: "Gare SNCF"
    poi_category: "mobilite"
    output_count_col: "gare_count"
    output_flag_col: "has_gare"

