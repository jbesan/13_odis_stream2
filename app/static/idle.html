<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OD&amp;IS — Session mise en veille</title>
    <style>
        :root {
            --singa-green: #1B4429;
            --singa-green-light: #265938;
            --singa-yellow: #F5D819;
            --singa-yellow-hover: #e2c514;
            --text-light: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, var(--singa-green-light) 0%, var(--singa-green) 70%);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }

        .idle-card {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .idle-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(245, 216, 25, 0.14);
            color: var(--singa-yellow);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 14px;
            color: var(--text-light);
        }

        p {
            font-size: 1.02rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .resume-btn {
            display: inline-block;
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 15px 28px;
            background-color: var(--singa-yellow);
            color: var(--singa-green);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .resume-btn:hover {
            background-color: var(--singa-yellow-hover);
        }

        .resume-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <main class="idle-card">
        <div class="idle-badge">Mode Éco</div>
        <h1>Session mise en veille</h1>
        <p>
            Votre session a été mise en pause après une période d'inactivité afin
            d'économiser les ressources du serveur. Vos résultats sont sauvegardés.
        </p>
        <button id="resume-session-btn" class="resume-btn" type="button">
            Reprendre ma session
        </button>
    </main>

    <script>
        (function () {
            function resolveSafeReturnUrl() {
                const params = new URLSearchParams(window.location.search);
                const rawReturn = params.get("return");
                if (
                    typeof rawReturn === "string" &&
                    rawReturn.startsWith("/") &&
                    !rawReturn.startsWith("//")
                ) {
                    return rawReturn;
                }
                return "/";
            }

            const btn = document.getElementById("resume-session-btn");
            if (btn) {
                btn.addEventListener("click", function () {
                    window.location.assign(resolveSafeReturnUrl());
                });
            }
        })();
    </script>
</body>
</html>
