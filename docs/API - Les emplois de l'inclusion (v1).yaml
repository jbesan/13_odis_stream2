openapi: 3.0.3
info:
  title: API - Les emplois de l'inclusion
  version: 1.0.0 (v1)
  description: Documentation de l'API **emplois.inclusion.beta.gouv.fr**
paths:
  /api/v1/candidats/:
    get:
      operationId: candidats_list
      description: |-
        # Liste des candidats par structure

        Cette API retourne la liste de tous les demandeurs d'emploi liés aux candidatures reçues par
        la ou les structure(s) sélectionnée(s).

        Les candidats sont triés par date de création dans la base des emplois de l'inclusion,
        du plus récent au plus ancien.

        # Permissions

        L'utilisation de cette API nécessite un jeton d'autorisation (`token`) :

        1. se connecter en tant qu’administrateur de la structure
        2. dans « Mon espace », se rendre sur la page « Accès aux API »
        3. utiliser l’action « Créer un token d’API »


        Le compte administrateur utilisé doit être **administrateur de toutes les structures dont il est membre**.
        Par défaut, l'API renvoie les candidatures reçues par la première structure dont le compte est membre
        car la première version avait été pensée ainsi.

        # Paramètres

        - mode_multi_structures : renvoie les candidats de toutes les structures.
        - uid_structures : renvoie les candidats des structures demandées.

        Attention, le compte doit être administrateur de toutes les structures dont il est membre.

        # Exemples de requêtes

        ## Mode multistructures

        ```bash
        curl
        -L 'https://emplois.inclusion.beta.gouv.fr/api/v1/candidats/?mode_multi_structures=1' -H 'Authorization: Token [token]'
        ```

        ## Fitre par structure

        Afin de trouver l'identifiant unique d'une structure, connectez-vous à votre espace personnel
        et cliquez sur « Mon espace » > « Accès aux APIs ».

        ### Une structure

        ```bash
        curl
        'https://emplois.inclusion.beta.gouv.fr/api/v1/candidats/?uid_structures=<uid_1>' --header 'Authorization: Token [token]'
        ```

        ### Plusieurs structures

        Séparez les identifiants par des virgules.

        ```bash
        curl
        'https://emplois.inclusion.beta.gouv.fr/api/v1/candidats/?uid_structures=<uid_1>,<uid_2>' --header 'Authorization: Token [token]'
        ```
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - candidats
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicantList'
          description: ''
  /api/v1/candidatures/recherche/:
    post:
      operationId: candidatures_recherche
      description: |2

        # API de recherche de candidatures

        Cette API retourne la liste de candidatures correspondant à une recherche selon les 4 critères suivants :

        - Numéro de sécurité sociale du candidat
        - Nom du candidat
        - Prénom du candidat
        - Date de naissance du candidat

        Cette API est à l’usage exclusif des conseils départementaux.

        # Permissions

        L’utilisation de cette API nécessite un token d’autorisation spécifique à chaque conseil départemental.

        # Limitations

        L’interrogation de cette API est limitée à 120 appels par minute et par conseil départemental.

        Elle ne retourne que les candidatures dont le dernier changement date de moins de 3 mois.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - candidatures
      requestBody:
        content:
