          type: string
          title: Nom de l’entreprise
        entreprise_siret:
          type: string
          readOnly: true
          title: SIRET de l’entreprise
          description: Le SIREN de l’organisation mère est susceptible d’être retourné
            pour des structures dont le SIRET est inconnu.
        entreprise_adresse:
          type: string
          title: Adresse postale de l’entreprise
        entreprise_employeur_email:
          type: string
          title: Adresse e-mail de l’employeur
        orientation_emetteur_type:
          allOf:
          - $ref: '#/components/schemas/OrientationEmetteurTypeEnum'
          title: Type d’émetteur
        orientation_emetteur_sous_type:
          oneOf:
          - enum:
            - ACI
            - AI
            - EA
            - EATT
            - EI
            - EITI
            - ETTI
            - GEIQ
            - OPCS
            type: string
          - enum:
            - AFPA
            - ASE
            - Orienteur
            - CAARUD
            - CADA
            - CAF
            - CAP_EMPLOI
            - CAVA
            - CCAS
            - CHRS
            - CHU
            - CIDFF
            - CPH
            - CSAPA
            - E2C
            - EPIDE
            - FT
            - HUDA
            - ML
            - MSA
            - OACAS
            - OIL
            - ODC
            - OHPD
            - OCASF
            - PENSION
            - PIJ_BIJ
            - PJJ
            - PLIE
            - RS_FJT
            - PREVENTION
            - DEPT
            - SPIP
            - Autre
            type: string
          nullable: true
          readOnly: true
          title: Sous-type d’émetteur
          description: "\n**Selon le type, les sous-types suivants sont applicables:**\n\n-
            **_Employeur :_** \n    - `ACI` : Atelier chantier d'insertion\n    -
            `AI` : Association intermédiaire\n    - `EA` : Entreprise adaptée\n    -
            `EATT` : Entreprise adaptée de travail temporaire\n    - `EI` : Entreprise
            d'insertion\n    - `EITI` : Entreprise d'insertion par le travail indépendant\n
            \   - `ETTI` : Entreprise de travail temporaire d'insertion\n    - `GEIQ`
            : Groupement d'employeurs pour l'insertion et la qualification\n    -
            `OPCS` : Organisation porteuse de la clause sociale\n- **_Prescripteur
            :_** \n    - `AFPA` : AFPA - Agence nationale pour la formation professionnelle
            des adultes\n    - `ASE` : ASE - Aide sociale à l'enfance\n    - `Orienteur`
            : Autre organisation (orienteur)\n    - `CAARUD` : CAARUD - Centre d'accueil
            et d'accompagnement à la réduction de risques pour usagers de drogues\n
            \   - `CADA` : CADA - Centre d'accueil de demandeurs d'asile\n    - `CAF`
            : CAF - Caisse d'allocations familiales\n    - `CAP_EMPLOI` : Cap emploi\n
            \   - `CAVA` : CAVA - Centre d'adaptation à la vie active\n    - `CCAS`
            : CCAS - Centre communal d'action sociale ou centre intercommunal d'action
            sociale\n    - `CHRS` : CHRS - Centre d'hébergement et de réinsertion
            sociale\n    - `CHU` : CHU - Centre d'hébergement d'urgence\n    - `CIDFF`
            : CIDFF - Centre d'information sur les droits des femmes et des familles\n
            \   - `CPH` : CPH - Centre provisoire d'hébergement\n    - `CSAPA` : CSAPA
            - Centre de soins, d'accompagnement et de prévention en addictologie\n
            \   - `E2C` : E2C - École de la deuxième chance\n    - `EPIDE` : EPIDE
            - Établissement pour l'insertion dans l'emploi\n    - `FT` : France Travail\n
            \   - `HUDA` : HUDA - Hébergement d'urgence pour demandeurs d'asile\n
            \   - `ML` : Mission locale\n    - `MSA` : MSA - Mutualité Sociale Agricole\n
            \   - `OACAS` : OACAS - Structure porteuse d'un agrément national organisme
            d'accueil communautaire et d'activité solidaire\n    - `OIL` : Opérateur
            d'intermédiation locative\n    - `ODC` : Organisation délégataire d'un
            Conseil Départemental (Orientation et suivi des BRSA)\n    - `OHPD` :
            Organisme habilité par le préfet de département\n    - `OCASF` : Organisme
            mentionné au 8° du I de l’article L. 312-1 du code de l’action sociale
            et des familles\n    - `PENSION` : Pension de famille / résidence accueil\n
            \   - `PIJ_BIJ` : PIJ-BIJ - Point/Bureau information jeunesse\n    - `PJJ`
            : PJJ - Protection judiciaire de la jeunesse\n    - `PLIE` : PLIE - Plan
            local pour l'insertion et l'emploi\n    - `RS_FJT` : Résidence sociale
            / FJT - Foyer de Jeunes Travailleurs\n    - `PREVENTION` : Service ou
            club de prévention\n    - `DEPT` : Service social du conseil départemental\n
            \   - `SPIP` : SPIP - Service pénitentiaire d'insertion et de probation\n
            \   - `Autre` : Autre"
        orientation_emetteur_nom:
          type: string
          nullable: true
          title: Nom de famille de l’émetteur
        orientation_emetteur_prenom:
          type: string
          nullable: true
