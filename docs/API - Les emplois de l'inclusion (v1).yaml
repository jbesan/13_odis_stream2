components:
  schemas:
    Applicant:
      type: object
      description: 'Applicant serializer: job seeker field of a job application'
      properties:
        civilite:
          type: string
          readOnly: true
        nom:
          type: string
        prenom:
          type: string
        courriel:
          type: string
        telephone:
          type: string
        adresse:
          type: string
        complement_adresse:
          type: string
        code_postal:
          type: string
        ville:
          type: string
        date_naissance:
          type: string
          format: date
        lieu_naissance:
          type: string
        pays_naissance:
          type: string
        lien_cv:
          type: string
        uid_structures:
          type: array
          items:
            type: string
      required:
      - adresse
      - civilite
      - code_postal
      - complement_adresse
      - courriel
      - date_naissance
      - lieu_naissance
      - nom
      - pays_naissance
      - prenom
      - telephone
      - uid_structures
      - ville
    AuteurDiagnosticEnum:
      enum:
      - EMPLOYEUR
      - GEIQ
      - PRESCRIPTEUR
      type: string
      description: |-
        * `EMPLOYEUR` - Employeur
        * `GEIQ` - GEIQ
        * `PRESCRIPTEUR` - Prescripteur
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Nom de l'utilisateur
        password:
          type: string
          writeOnly: true
          title: Mot de passe
        token:
          type: string
          readOnly: true
          title: Jeton
      required:
      - password
      - token
      - username
    CandidatPassIaeStatutEnum:
      enum:
      - EXPIRED
      - VALID
      - FUTURE
      - SUSPENDED
      type: string
      description: |-
        * `EXPIRED` - Expiré
        * `VALID` - Valide
        * `FUTURE` - Valide (non démarré)
        * `SUSPENDED` - Valide (suspendu)
    City:
      type: object
      properties:
        nom:
          type: string
        departement:
          type: string
        code_postaux:
          type: array
          items:
            type: string
        code_insee:
          type: string
      required:
      - code_insee
      - code_postaux
      - departement
      - nom
    Civilite:
      enum:
      - M
      - MME
      type: string
      description: |-
        * `M` - Monsieur
        * `MME` - Madame
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        siret:
          type: string
          readOnly: true
        description:
          type: string
        site_web:
          type: string
        telephone:
          type: string
        courriel:
          type: string
        code_postal:
          type: string
        commune:
          type: string
        adresse:
          type: string
        complement_adresse:
          type: string
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        date_maj:
          type: string
          readOnly: true
        lien_source:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/CompanyKindEnum'
      required:
      - adresse
      - code_postal
      - commune
      - complement_adresse
      - courriel
      - date_maj
      - description
      - id
      - kind
      - latitude
      - lien_source
      - longitude
      - nom
      - siret
      - site_web
      - telephone
    CompanyKindEnum:
      enum:
      - ACI
      - AI
      - EA
      - EATT
      - EI
      - EITI
      - ETTI
      - GEIQ
      - OPCS
      type: string
      description: |-
        * `ACI` - Atelier chantier d'insertion
        * `AI` - Association intermédiaire
        * `EA` - Entreprise adaptée
        * `EATT` - Entreprise adaptée de travail temporaire
        * `EI` - Entreprise d'insertion
        * `EITI` - Entreprise d'insertion par le travail indépendant
        * `ETTI` - Entreprise de travail temporaire d'insertion
        * `GEIQ` - Groupement d'employeurs pour l'insertion et la qualification
        * `OPCS` - Organisation porteuse de la clause sociale
    CriteresEligibiliteEnum:
      enum:
      - AAH
      - ASS
      - MINSOC
      - RSA
      - RS/PS/DA
      - '+45'
      - DELD12/24
      - DELD24+
      - '-26'
      - -26 SQ
      - FR non maitrisé
      - NE3I
      - PI
      - SIAE/CUI
      - DELD
      - Reconv.
      - PSH/PR
      - PM
      - Refug.|RS/PS/DA
      - QPV|QPV/ZRR
      - ZRR|QPV/ZRR
      - '+50'
      - Detention/MJ|Prison
      - ASE
      - Pers. SH|TH
      type: string
      description: |-
        * `AAH` - Allocataire de l'Allocation aux Adultes Handicapés (AAH)
        * `ASS` - Allocataire de l'Allocation de Solidarité Spécifique (ASS)
        * `` - Personne inscrite à France Travail
        * `MINSOC` - Bénéficiaire des minima sociaux
        * `RSA` - Bénéficiaire du Revenu de Solidarité Active (RSA)
        * `RS/PS/DA` - Demandeur d'asile
        * `+45` - Demandeur d’emploi de 45 ans et plus
        * `DELD12/24` - Demandeur d'emploi de longue durée (DELD) (12 mois et plus)
        * `DELD24+` - Demandeur d'emploi de très longue durée (DETLD) (24 mois et plus)
        * `-26` - Jeune (-26 ans)
        * `-26 SQ` - Jeune de moins de 26 ans sans qualification (niveau 4 maximum)
        * `FR non maitrisé` - Maîtrise de la langue française inférieure au niveau A1
        * `NE3I` - Niveau d'étude 3 (CAP, BEP) ou infra
        * `PI` - Parent isolé
        * `SIAE/CUI` - Personne bénéficiant ou sortant d’un dispositif d’insertion
        * `DELD` - Personne éloignée du marché du travail (> 1 an)
        * `Reconv.` - Personne en reconversion professionnelle contrainte
        * `PSH/PR` - Personne sans hébergement ou hébergée ou ayant un parcours de rue
        * `PM` - Problème de mobilité
        * `Refug.|RS/PS/DA` - Réfugiés statutaire ou bénéficiaire de la protection subsidiaire
        * `QPV|QPV/ZRR` - Résident en quartier prioritaire de la politique de la ville (QPV)
        * `ZRR|QPV/ZRR` - Résident en zone de revitalisation rurale (ZRR)
        * `+50` - Senior (+50 ans)
        * `Detention/MJ|Prison` - Sortant de détention ou personne placée sous main de justice
        * `ASE` - Sortant de l'Aide Sociale à l'Enfance (ASE)
        * `Pers. SH|TH` - Travailleur handicapé
    DataInclusionStructure:
      oneOf:
      - $ref: '#/components/schemas/PrescriberOrgStructure'
      - $ref: '#/components/schemas/Company'
      discriminator:
        propertyName: type
        mapping:
          orga: '#/components/schemas/PrescriberOrgStructure'
          siae: '#/components/schemas/Company'
    EmployeeRecordAPI:
      type: object
      description: |-
        This serializer is a version with the `numeroAnnexe` field added (financial annex number).

        This field not needed by ASP was simply ignored in earlier versions of the
        main SFTP serializer but was removed for RGPD concerns.
      properties:
        numLigne:
          type: integer
        typeMouvement:
          type: string
        siret:
          type: string
        mesure:
          type: string
        personnePhysique:
          $ref: '#/components/schemas/_API_Person'
        adresse:
          $ref: '#/components/schemas/_API_Address'
        situationSalarie:
          $ref: '#/components/schemas/_API_Situation'
        codeTraitement:
          type: string
